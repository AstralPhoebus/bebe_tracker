<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Journal de bébé</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
(function () {
  var dark;
  try {
    var p = JSON.parse(localStorage.getItem('bb.prefs') || '{}');
    var t = p.theme || 'auto';
    var h = new Date().getHours();
    var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    dark = t === 'dark' || (t === 'auto' && (sys || h >= 20 || h < 7));
  } catch (e) {
    var h2 = new Date().getHours();
    dark = h2 >= 20 || h2 < 7;
  }
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<style>
:root {
  color-scheme: light;
  --bg: #E7E0D3;
  --surface: #F2EDE4;
  --surface-2: #DAD0BF;
  --line: #CDC2AF;
  --text: #2F261D;
  --muted: #6B5B45;
  --accent: #86541F;
  --on-accent: #FBF6EE;
  --alert: #9A3F22;
  --alert-bg: #EED8C8;
  --ok: #55612E;
  --scrim: rgba(40, 28, 16, .45);
  --font: "Figtree", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000;
    --surface: #15100B;
    --surface-2: #221911;
    --line: #2C2117;
    --text: #D8BA90;
    --muted: #8C7356;
    --accent: #CC8840;
    --on-accent: #120A03;
    --alert: #CF6E43;
    --alert-bg: #2A1409;
    --ok: #A6A469;
    --scrim: rgba(0, 0, 0, .7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000;
  --surface: #15100B;
  --surface-2: #221911;
  --line: #2C2117;
  --text: #D8BA90;
  --muted: #8C7356;
  --accent: #CC8840;
  --on-accent: #120A03;
  --alert: #CF6E43;
  --alert-bg: #2A1409;
  --ok: #A6A469;
  --scrim: rgba(0, 0, 0, .7);
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 540px; margin: 0 auto; padding: 0 18px; }
.emo { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; line-height: 1; }
:root[data-theme="dark"] .emo { filter: sepia(.85) saturate(.7) brightness(.8); }

/* En-tête */
.top { flex: none; position: relative; z-index: 5; background: var(--bg); padding-top: 12px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.who h1 { margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }
.who p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.icon {
  appearance: none; border: 1px solid var(--line); background: transparent;
  border-radius: 999px; width: 44px; height: 44px; font-size: 18px; flex: none;
}
.tabs { display: flex; gap: 2px; margin-top: 10px; border-bottom: 1px solid var(--line); }
.tab {
  appearance: none; background: none; border: 0; padding: 10px 12px 9px;
  font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent;
  margin-bottom: -1px; position: relative;
}
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab .dot { position: absolute; top: 9px; right: 2px; width: 7px; height: 7px; border-radius: 50%; background: var(--alert); }

main { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 14px 0 28px; }

/* Bandeaux */
.banner {
  display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
  appearance: none; border: 0; background: var(--alert-bg); color: var(--text);
  border-radius: 14px; padding: 12px 14px; margin: 0 0 10px; font-size: 14.5px; line-height: 1.4;
}
.banner.soft { background: var(--surface); }
.banner > .emo { font-size: 20px; }
.banner .x { appearance: none; border: 0; background: none; color: var(--muted); margin-left: auto; padding: 0 2px; font-size: 16px; }

/* Dernière fois */
.last { padding: 4px 0 16px; border-bottom: 1px solid var(--line); }
.last-label { margin: 0; font-size: 15px; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.last-label .emo { font-size: 20px; }
.last-big { margin: 2px 0 0; font-size: 54px; line-height: 1.05; font-weight: 800; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.last-sub { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.mini { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 12px; font-size: 15px; color: var(--muted); }
.mini .emo { font-size: 18px; margin-right: 6px; vertical-align: -2px; }

/* Journée */
.dayhead { display: flex; align-items: center; gap: 4px; margin: 18px 0 4px; }
.dayhead h2 { margin: 0; font-size: 18px; font-weight: 700; min-width: 0; }
.nav { appearance: none; border: 0; background: none; width: 38px; height: 38px; border-radius: 50%; font-size: 24px; line-height: 1; color: var(--muted); flex: none; }
.nav:disabled { opacity: .25; cursor: default; }
.share {
  margin-left: auto; appearance: none; border: 1.5px solid var(--accent); background: transparent;
  color: var(--accent); border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 14.5px; flex: none;
}
.journal { list-style: none; margin: 0; padding: 0; }
.jl {
  appearance: none; width: 100%; display: grid; grid-template-columns: 78px 1fr; align-items: center;
  gap: 8px; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 11px 0; text-align: left;
}
.jl time { font-size: 20px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.jl .emos { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.jl .emos .emo { font-size: 29px; }
.jl .note { font-size: 14px; color: var(--muted); margin-left: -2px; }
.jl.fresh { animation: fresh 1.3s ease-out; }
@keyframes fresh { from { background: var(--surface-2); } to { background: transparent; } }
.empty { color: var(--muted); padding: 18px 0; margin: 0; }

.tip { margin-top: 26px; background: var(--surface); border-radius: 18px; padding: 16px 18px; }
.tip h2 { margin: 0 0 6px; font-size: 15px; color: var(--muted); font-weight: 700; }
.tip p { margin: 0; font-size: 16.5px; line-height: 1.5; }
.tip .hint { margin-top: 10px; }

/* Barre d'actions */
#dock {
  position: relative; flex: none; z-index: 6; background: var(--bg);
  border-top: 1px solid var(--line); padding: 10px 0;
}
#dock .wrap { position: relative; padding: 0 12px; }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.qb {
  appearance: none; border: 0; border-radius: 16px; background: var(--surface); min-height: 66px;
  padding: 9px 2px 7px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 5px; touch-action: manipulation; transition: transform .08s ease-out; min-width: 0;
}
.qb .emo { font-size: 27px; }
.qb .ql { font-size: 11.5px; font-weight: 600; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 3px; }
.qb:active { transform: scale(.93); background: var(--surface-2); }
.qb.more { background: transparent; border: 1.5px dashed var(--line); }
.qb.more .plus { font-family: var(--font); font-size: 26px; color: var(--muted); filter: none; font-weight: 400; }
.toast {
  position: absolute; left: 12px; right: 12px; bottom: calc(100% + 18px); background: var(--surface-2);
  border-radius: 16px; padding: 12px 14px; box-shadow: 0 8px 28px rgba(0, 0, 0, .28);
}
.toast p { margin: 0 0 9px; font-size: 15px; }
.toast .emo { font-size: 18px; vertical-align: -2px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip {
  appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 7px 12px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip.undo { border-color: transparent; background: transparent; color: var(--alert); }
.toast .chip.undo { margin-left: auto; }

/* Feuilles */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; }
.panel {
  width: 100%; max-width: 560px; margin: 0 auto; background: var(--surface);
  border-radius: 22px 22px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
  max-height: 88vh; overflow: auto;
}
.panel h3 { margin: 0 0 12px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
.panel h3 .emo { font-size: 26px; }
.panel h4 { margin: 16px 0 8px; font-size: 14px; color: var(--muted); font-weight: 700; }
.panel .qb { background: var(--bg); }
.primary, .secondary {
  display: block; appearance: none; width: 100%; margin-top: 12px; border-radius: 14px;
  padding: 13px 16px; font-weight: 700; font-size: 16px; text-align: center; text-decoration: none;
}
.primary { border: 0; background: var(--accent); color: var(--on-accent); }
.secondary { border: 1.5px solid var(--line); background: transparent; color: var(--text); }
.secondary.danger { color: var(--alert); border-color: var(--alert); }
.ico { width: 20px; height: 20px; vertical-align: -4px; margin-right: 8px; }
.fld { display: block; margin: 12px 0; }
.fld > span { display: block; font-size: 13.5px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
input[type="text"], input[type="date"], input[type="time"] {
  width: 100%; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 12px; padding: 11px 12px; min-height: 46px; font-size: 16px;
}
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  appearance: none; border: 1.5px solid var(--line); background: transparent; border-radius: 999px;
  padding: 9px 15px; font-weight: 600;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.seg.big button { flex: 1; padding: 18px 10px; font-size: 18px; border-radius: 16px; }
.sgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.hint { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; line-height: 1.45; }
.warn { background: var(--alert-bg); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; margin: 8px 0 0; }
.edit-list { list-style: none; margin: 0; padding: 0; }
.edit-list > li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.er { display: grid; grid-template-columns: auto 1fr 108px auto; align-items: center; gap: 8px; }
.er .emo { font-size: 24px; }
.er .el { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.er input[type="time"] { padding: 8px; min-height: 42px; }
.edit-list .en { margin-top: 8px; }
pre.preview {
  white-space: pre-wrap; background: var(--bg); border-radius: 14px; padding: 14px; margin: 12px 0 0;
  font-family: var(--font); font-size: 17px; line-height: 1.65; user-select: text; -webkit-user-select: text;
  max-height: 38vh; overflow: auto;
}
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
.actions .wide { grid-column: 1 / -1; }

/* Santé */
.sec { margin: 22px 0 6px; font-size: 18px; font-weight: 800; }
section > .sec:first-child { margin-top: 4px; }
.vlist { list-style: none; margin: 10px 0 0; padding: 0; }
.v { padding: 14px 0; border-bottom: 1px solid var(--line); }
.vh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.vh strong { font-size: 18px; }
.vh span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.v ul { margin: 8px 0 0; padding: 0; list-style: none; font-size: 15px; }
.v li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
.v .note { color: var(--muted); font-size: 13px; display: block; }
.tag { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 7px; white-space: nowrap; align-self: flex-start; }
.tag.obl { background: var(--accent); color: var(--on-accent); }
.tag.rec { border: 1px solid var(--line); color: var(--muted); }
.tag.exa { border: 1px solid var(--accent); color: var(--accent); }
.vstate { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 14.5px; font-weight: 600; }
.vstate .chip { margin-left: auto; }
.vstate.soon { color: var(--accent); }
.vstate.late { color: var(--alert); }
.vstate.done { color: var(--ok); }
.v.done ul { opacity: .55; }
.foot p { color: var(--muted); font-size: 13.5px; margin: 14px 0 0; }

/* Réglages */
.btnlist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.btnlist li { display: grid; grid-template-columns: 62px 1fr; gap: 8px; }
.btnlist .bE { text-align: center; font-size: 24px; padding: 6px; }
#syncText { margin: 4px 0 0; font-size: 15px; }

/* Plus, totaux, calendrier */
.morebar {
  appearance: none; width: 100%; margin-top: 8px; border: 1.5px dashed var(--line); background: transparent;
  border-radius: 14px; padding: 9px 12px; font-size: 14px; font-weight: 600; color: var(--muted);
}
.calbtn {
  appearance: none; border: 1px solid var(--line); background: transparent; color: var(--text);
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; margin-left: 2px;
}
.calbtn svg { width: 21px; height: 21px; }
#dayTitle { cursor: pointer; }
.totals { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 2px 0 6px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
.totals .emo { font-size: 17px; margin-right: 4px; vertical-align: -2px; }
.seg.big button small { display: block; font-size: 12.5px; font-weight: 600; margin-top: 3px; }
.seg.big button.sug { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.calhead h3 { margin: 0; }
.calhead h3::first-letter { text-transform: uppercase; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
.cal .wd { font-size: 12.5px; color: var(--muted); font-weight: 700; padding: 4px 0; }
.cd {
  appearance: none; border: 0; background: transparent; color: var(--text); aspect-ratio: 1; border-radius: 9px;
  font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; position: relative; padding: 0;
}
.cd.has::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
.cd.today { background: var(--accent); color: var(--on-accent); }
.cd.today.has::after { background: var(--on-accent); }
.cd.sel:not(.today) { box-shadow: inset 0 0 0 2px var(--accent); }
.cd:disabled { color: var(--muted); opacity: .3; cursor: default; }
.cal-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--muted); }
.cal-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--accent); vertical-align: -1px; margin-right: 6px; }
.cal-legend i.dot { width: 6px; height: 6px; border-radius: 50%; vertical-align: 1px; }

/* Fermeture du message, photos */
.toast { padding-right: 46px; }
.tclose {
  appearance: none; position: absolute; top: 6px; right: 6px; width: 36px; height: 36px; border: 0;
  background: transparent; color: var(--muted); font-size: 16px; border-radius: 50%;
}
.panel .qb .ql { white-space: normal; text-align: center; line-height: 1.2; }
.photo-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.vh { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }
.pbtn {
  appearance: none; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--line);
  border-radius: 14px; padding: 12px 8px; font-weight: 600; font-size: 15px; cursor: pointer; text-align: center; background: var(--bg);
}
.pbtn .emo { font-size: 20px; }
.photo-prev { display: flex; align-items: flex-end; gap: 10px; margin-top: 12px; }
.photo-prev img { display: block; max-width: 70%; max-height: 190px; border-radius: 14px; object-fit: cover; }
.photo-big { display: block; max-width: 100%; max-height: 260px; border-radius: 14px; object-fit: cover; margin-top: 10px; }
.edit-photo .chips { margin-top: 8px; }
.jl .thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; display: block; background: var(--surface-2); }
.ph-missing { font-size: 18px; opacity: .6; }
:root[data-theme="dark"] .thumb, :root[data-theme="dark"] .photo-big, :root[data-theme="dark"] .photo-prev img { filter: sepia(.35) brightness(.8); }

/* Photo de bébé (avatar) et recadrage */
.who { flex: 1; min-width: 0; }
.avatar {
  appearance: none; flex: none; width: 54px; height: 54px; border-radius: 50%; padding: 0;
  border: 1.5px dashed var(--line); background: var(--surface); color: var(--muted);
  font-size: 26px; font-weight: 400; line-height: 1; display: grid; place-items: center; overflow: hidden;
}
.avatar.has { border: 2px solid var(--accent); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar-big { width: min(70vw, 260px); aspect-ratio: 1; border-radius: 50%; overflow: hidden; margin: 4px auto 12px; border: 3px solid var(--accent); }
.avatar-big img { width: 100%; height: 100%; object-fit: cover; display: block; }
.panel h3.center-h { justify-content: center; margin-bottom: 0; }
.hint.center { text-align: center; margin-top: 2px; }
:root[data-theme="dark"] .avatar img, :root[data-theme="dark"] .avatar-big img, :root[data-theme="dark"] .crop-img { filter: sepia(.35) brightness(.8); }
.crop-stage {
  position: relative; width: min(100%, 300px); aspect-ratio: 1; margin: 12px auto 0; overflow: hidden;
  border-radius: 16px; background: #000; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
}
.crop-stage:active { cursor: grabbing; }
.crop-img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; pointer-events: none; will-change: transform; }
.crop-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .75); box-shadow: 0 0 0 600px rgba(0, 0, 0, .58); pointer-events: none; }
.crop-zoom { display: flex; align-items: center; gap: 12px; max-width: 300px; margin: 12px auto 0; font-size: 20px; color: var(--muted); }
.crop-zoom input { flex: 1; accent-color: var(--accent); min-height: 32px; }

/* Tétée en cours, poids et biberons */
.live { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding: 7px 7px 7px 12px; border-radius: 14px; background: var(--surface-2); border: 1.5px solid var(--accent); }
.live .emo { font-size: 20px; }
.live .lv-t { font-size: 14px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live strong { font-size: 18px; font-variant-numeric: tabular-nums; }
.lv-stop { appearance: none; border: 0; background: var(--accent); color: var(--on-accent); border-radius: 10px; padding: 9px 14px; font-weight: 700; }
.wpill {
  appearance: none; margin-top: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 999px; padding: 4px 11px 4px 8px; font-size: 13.5px; font-weight: 600; display: inline-flex;
  align-items: center; gap: 6px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wpill .emo { font-size: 15px; }
.appert { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.appert div { background: var(--bg); border-radius: 14px; padding: 12px; }
.appert strong { display: block; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.appert span { font-size: 13px; color: var(--muted); }
.appert p { grid-column: 1 / -1; margin: 0; }

/* ---------- Migration : boutons renommés -> vrais types ---------- */
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
function migrate() {
  if (prefs.mig2) return;
  const byLabel = {};
  for (const [k, c] of Object.entries(CATALOG)) byLabel[norm(c.l)] = k;
  const btns = profile.buttons || {};
  const map = {};
  for (const [k, o] of Object.entries(btns)) {

  }
  let touched = false;
  if (Object.keys(map).length) {

  const clean = {};
  for (const [k, o] of Object.entries(btns)) {
    if (map[k] || !CATALOG[k] || !o) continue;

    if (o.e && o.e !== CATALOG[k].e) keep.e = o.e;

function setEvent(day, id, patch) {

/* ---------- Photos (stockées sur le téléphone) ---------- */
const photoDB = (() => {
  let opening = null;
  const open = () => opening || (opening = new Promise((res, rej) => {
    if (!('indexedDB' in window)) { rej(new Error('indexedDB indisponible')); return; }
    const r = indexedDB.open('bb-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => res(r.result);
    r.onerror = () => { opening = null; rej(r.error); };
  }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('photos', mode);
    const req = fn(t.objectStore('photos'));
    t.oncomplete = () => res(req ? req.result : undefined);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  }));
  return {
    put: (id, blob) => tx('readwrite', st => st.put(blob, id)),
    get: id => tx('readonly', st => st.get(id)),
    del: id => tx('readwrite', st => st.delete(id)),
    clear: () => tx('readwrite', st => st.clear())
  };
})();
const phURLs = new Map();
async function photoURL(id) {
  if (phURLs.has(id)) return phURLs.get(id);
  try {
    const b = await photoDB.get(id);
    if (!b) return null;
    const u = URL.createObjectURL(b);
    phURLs.set(id, u);
    return u;
  } catch (e) { return null; }
}

}

function compressImage(file, max = 1600, q = 0.82) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    const timer = setTimeout(() => { img.onload = img.onerror = null; URL.revokeObjectURL(url); reject(new Error('délai')); }, 15000);
    img.onload = () => {
      clearTimeout(timer);
      try {
        const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * r)), h = Math.max(1, Math.round(img.naturalHeight * r));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        c.toBlob(b => (b ? resolve(b) : reject(new Error('compression'))), 'image/jpeg', q);
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { clearTimeout(timer); URL.revokeObjectURL(url); reject(new Error('lecture')); };
    img.src = url;
  });
}
async function preparePhoto(file) {
  try { return await compressImage(file); }
  catch (e) {
    if (file && (!file.type || file.type.startsWith('image/')) && file.size < 12e6) return file;
    throw e;
  }
}

/* ---------- Synchronisation (journal partagé) ---------- */
let db = null, readOnly = false;
const chains = {}, pushTimers = {}, subs = {};
let profUnsub = null, profTimer = null;

function enqueue(key, fn) {
  chains[key] = (chains[key] || Promise.resolve()).then(fn).catch(onDbError);
}
function onDbError(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') readOnly = true;
  else if (['revoked', 'not_granted', 'capability_disabled', 'capability_removed'].includes(c)) { unsubAll(); db = null; }
  renderSync();
}
function unsubAll() {
  for (const d of Object.keys(subs)) { try { subs[d](); } catch (e) {} delete subs[d]; }
  if (profUnsub) { try { profUnsub(); } catch (e) {} profUnsub = null; }
}
function packEv(e) {
  const o = { t: e.t, ts: e.ts, n: e.n || '', x: e.x ? 1 : 0, ph: e.ph || '', du: Number(e.du) || 0, run: e.run ? 1 : 0, ml: Number(e.ml) || 0 };
  if (e.q) o.q = { g: Number(e.q.g) || 0, d: Number(e.q.d) || 0 };
  return o;
}
function pushEvent(day, id) {
  if (!db) return;
  const key = day + '/' + id;
  clearTimeout(pushTimers[key]);
  pushTimers[key] = setTimeout(() => enqueue('d:' + day, async () => {
    const ev = days[day] && days[day][id];
    if (!ev || !db) return;
    const sent = packEv(ev);
    const body = { events: { [id]: sent } };
    const ref = db.doc('days/' + day);
    try {
      await ref.update(body);
    } catch (e) {
      if (e && e.code === 'invalid_argument') {
        const snap = await ref.get();
        if (snap.exists) throw e;
        await ref.set(body);
      } else throw e;
    }
    const cur = days[day] && days[day][id];
    if (cur && JSON.stringify(packEv(cur)) === JSON.stringify(sent)) { cur.p = 0; saveDays(); }
  }), 350);
}
function saveProfile() {
  store.set('bb.profile', profile);
  profilePending = true;
  store.set('bb.profilePending', true);
  clearTimeout(profTimer);
  profTimer = setTimeout(pushProfile, 500);
}
function pushProfile() {
  if (!db) return;
  enqueue('profile', async () => {
    if (!db) return;
    const sent = JSON.stringify(profile);
    await db.doc('family/profile').set(JSON.parse(sent));
    if (JSON.stringify(profile) === sent) { profilePending = false; store.set('bb.profilePending', false); }
  });
}
function applyRemoteProfile(d) {
  d = d || {};
  const obj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? JSON.parse(JSON.stringify(v)) : {};
  profile = Object.assign(blankProfile(), {
    name: String(d.name || ''),
    birth: /^\d{4}-\d{2}-\d{2}$/.test(String(d.birth || '')) ? d.birth : '',
    sex: ['f', 'm'].includes(d.sex) ? d.sex : '',
    buttons: obj(d.buttons),
    vacc: obj(d.vacc),
    weight: Number(d.weight) > 0 ? Number(d.weight) : 0,
    weightAt: Number(d.weightAt) || 0,
    bottles: [4, 5, 6, 7, 8].includes(Number(d.bottles)) ? Number(d.bottles) : 6
  });
  store.set('bb.profile', profile);
}
function subscribeDay(day) {
  try {
    subs[day] = db.doc('days/' + day).onSnapshot(snap => {
      const data = snap.exists ? (snap.data() || {}) : {};
      const remote = (data.events && typeof data.events === 'object') ? data.events : {};
      const merged = {};
      for (const [id, e] of Object.entries(remote)) {
        if (e && typeof e === 'object') {
          merged[id] = { t: String(e.t || ''), ts: Number(e.ts) || 0, n: String(e.n || ''), x: e.x ? 1 : 0, p: 0, ph: String(e.ph || ''), du: Number(e.du) || 0, run: e.run ? 1 : 0, ml: Number(e.ml) || 0 };
          if (e.q && typeof e.q === 'object') merged[id].q = { g: Number(e.q.g) || 0, d: Number(e.q.d) || 0 };
        }
      }
      for (const [id, e] of Object.entries(days[day] || {})) if (e && e.p) merged[id] = e;
      days[day] = merged;
      saveDays();
      render();
    }, err => { delete subs[day]; onDbError(err); });
  } catch (e) { onDbError(e); }
}
function ensureSubs() {
  if (!db) return;
  const t = todayKey();
  const want = new Set([t, shiftDay(t, -1), viewDay]);
  for (const d of Object.keys(subs)) if (!want.has(d)) { try { subs[d](); } catch (e) {} delete subs[d]; }
  for (const d of want) if (!subs[d]) subscribeDay(d);
}
async function initDb() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const d = await window.claude.use('db');
    if (!d) return;
    db = d;
    try {
      const snap = await db.doc('family/profile').get();
      if (profilePending || (!snap.exists && (profile.birth || profile.name))) pushProfile();
      else if (snap.exists) applyRemoteProfile(snap.data());
    } catch (e) { onDbError(e); if (!db) return; }
    for (const [day, evs] of Object.entries(days)) for (const [id, e] of Object.entries(evs || {})) if (e && e.p) pushEvent(day, id);
    profUnsub = db.doc('family/profile').onSnapshot(snap => {
      if (!snap.exists || profilePending) return;
      applyRemoteProfile(snap.data());
      render();
    }, err => onDbError(err));
    ensureSubs();
    render(true);
  } catch (e) { db = null; }
}

function ageDays() {
  if (!profile.birth) return null;
  return Math.round((parseDay(todayKey()) - parseDay(profile.birth)) / 86400000);
}
function ageLabel() {
  const d = ageDays();
  if (d == null) return '';
  if (d < 0) return 'Naissance à venir';
  if (d === 0) return 'Jour de naissance';
  if (d < 14) return `${d} jour${d > 1 ? 's' : ''}`;
  if (d < 61) { const w = Math.floor(d / 7), r = d % 7; return r ? `${w} sem. et ${r} j` : `${w} semaines`; }
  const b = parseDay(profile.birth), t = parseDay(todayKey());
  let m = (t.getFullYear() - b.getFullYear()) * 12 + (t.getMonth() - b.getMonth());
  if (t.getDate() < b.getDate()) m--;
  const w = Math.floor(Math.round((t - addMonths(b, m)) / 86400000) / 7);
  return w > 0 ? `${m} mois et ${w} sem.` : `${m} mois`;
}
function scheduleRows() {
  if (!profile.birth) return [];
  const b = parseDay(profile.birth), t = parseDay(todayKey());
  return SCHEDULE.map(g => {
    const date = g.m != null ? addMonths(b, g.m) : new Date(b.getFullYear(), b.getMonth(), b.getDate() + g.d);
    return Object.assign({}, g, {
      date,
      diff: Math.round((date - t) / 86400000),
      done: (profile.vacc || {})[g.id] || 0,
      mandatory: g.items.some(i => i.k !== 'rec')
    });
  });
}
function dueRow() {
  const c = scheduleRows().filter(r => !r.done && r.mandatory && r.diff <= 21 && r.diff >= -30);

}

/* ---------- Tétée chronométrée ---------- */
const LONG_FEED = 90 * 60000;
const askedFeeds = new Set();
function runningFeed() {
  const ev = recent();

  return null;
}
const clock = ms => {
  const sec = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), r = sec % 60;
  return h ? `${h}:${pad(m)}:${pad(r)}` : `${m}:${pad(r)}`;
};
function renderLive() {
  const el = $('#live'), f = runningFeed();
  if (!f) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = `<span class="emo">${esc(ty('tetee').e)}</span><span class="lv-t">Tétée en cours${f.n ? `, sein ${esc(f.n)}` : ''}</span><strong id="liveClock">${clock(Date.now() - f.ts)}</strong><button class="lv-stop" type="button" data-stop="${esc(f.day)}|${esc(f.id)}">Terminer</button>`;
}
function closeRunningFeeds() {
  const now = Date.now();
  recent().forEach(e => {
    if (e.t === 'tetee' && e.run && now - e.ts <= LONG_FEED) setEvent(e.day, e.id, { du: Math.max(1, Math.round((now - e.ts) / 60000)), run: 0 });
  });
}
function stopFeed(ev) {
  const m = Math.round((Date.now() - ev.ts) / 60000);
  if (m * 60000 > LONG_FEED) { askDuration(ev); return; }
  setEvent(ev.day, ev.id, { du: Math.max(1, m), run: 0 });
  buzz();
  showInfo(`Tétée terminée : ${fmtDur(Math.max(1, m))}.`);
  render();
}
function askDuration(ev) {
  openSheet(`<h3><span class="emo">${esc(ty('tetee').e)}</span>Durée de la tétée</h3><p>La tétée commencée à ${fmtTime(ev.ts)}${ev.n ? ` (sein ${esc(ev.n)})` : ''} n’a pas été arrêtée. Combien de temps a-t-elle duré environ ?</p><div class="chips">${[5, 10, 15, 20, 30, 45, 60].map(m => `<button class="chip" type="button" data-du="${m}">${m} min</button>`).join('')}</div><label class="fld"><span>Autre durée, en minutes</span><input type="text" inputmode="numeric" id="duIn" autocomplete="off" placeholder="Ex. 25"></label><button class="primary" type="button" id="duOk">Valider</button><button class="secondary" type="button" data-close>Plus tard</button>`, p => {
    const done = m => {

      render();
      setTimeout(checkLongFeeds, 400);

    p.onclick = e => {
      const c = e.target.closest('[data-du]');
      if (c) { done(Number(c.dataset.du)); return; }
      if (e.target.closest('#duOk')) { const v = parseInt($('#duIn', p).value, 10); if (v > 0 && v < 600) done(v); }

function checkLongFeeds() {
  if (!sheet.hidden) return;
  const now = Date.now();
  const f = recent().find(e => e.t === 'tetee' && e.run && now - e.ts > LONG_FEED && !askedFeeds.has(e.id));
  if (f) { askedFeeds.add(f.id); askDuration(f); }
}

/* ---------- Biberon : quantité donnée ou bue ---------- */
function recentMl(max) {

  all.sort((a, b) => b.ts - a.ts);
  const out = [];
  for (const e of all) { const v = Number(e.ml); if (!out.includes(v)) out.push(v); if (out.length >= max) break; }

}

function openPump() {

let obCrop = null, obSrc = null;
function mountCropper(box, blob, init) {

    b = Math.max(S / w, S / h);

    ty = S / 2 - cy * h * b * z;

$('#calBtn').addEventListener('click', openCalendar);
$('#dayTitle').addEventListener('click', openCalendar);
$('#dayTitle').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCalendar(); } });
$('#journal').addEventListener('click', e => {
  const b = e.target.closest('[data-ids]');
  if (b) openGroup(viewDay, b.dataset.ids.split(','));
});
$('#prevDay').addEventListener('click', () => { viewDay = shiftDay(viewDay, -1); ensureSubs(); renderJournal(); });
$('#nextDay').addEventListener('click', () => { if (viewDay < todayKey()) { viewDay = shiftDay(viewDay, 1); ensureSubs(); renderJournal(); } });
$('#shareBtn').addEventListener('click', openShare);
$('#themeBtn').addEventListener('click', () => {
  prefs.theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  savePrefs(); applyTheme();
  if (tab === 'reglages') render(true);
});
function switchTab(t) {
  tab = t; hideToast(); $('#scroller').scrollTop = 0; render(true);
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
document.addEventListener('click', e => {
  const fv = e.target.closest('[data-fever]');
  if (fv) { prefs.seenFever[fv.dataset.fever] = 1; savePrefs(); renderJour(); return; }
  const g = e.target.closest('[data-go]');
  if (g && !sheet.contains(g)) switchTab(g.dataset.go);
});
const santeEl = $('#tab-sante');
santeEl.addEventListener('click', e => {
  const d = e.target.closest('[data-done]');
  if (d) {
    const id = d.dataset.done;
    if (!profile.vacc) profile.vacc = {};
    profile.vacc[id] = Date.now();
    saveProfile();
    const g = SCHEDULE.find(x => x.id === id);
    if (g) {
      if (g.id === 'j8') addEvent('pediatre', 'examen du 8e jour');
      else addEvent('vaccin', g.id === 'vrs' ? 'protection bronchiolite' : `vaccins des ${g.title}`);
    }
    buzz(); render();
    return;
  }
  const u = e.target.closest('[data-undone]');
  if (u) { delete profile.vacc[u.dataset.undone]; saveProfile(); render(); }
  const go = e.target.closest('[data-go]');
  if (go) switchTab(go.dataset.go);
});
const st = $('#tab-reglages');
let typeTimer = null;
st.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'sName') {
    profile.name = t.value.trim(); renderHeader();
    clearTimeout(typeTimer); typeTimer = setTimeout(saveProfile, 400);
  } else if (t.classList.contains('bL')) {
    const k = t.dataset.k;
    if (!profile.buttons[k]) profile.buttons[k] = {};
    profile.buttons[k].l = t.value.trim();
    renderGrid();
    clearTimeout(typeTimer); typeTimer = setTimeout(saveProfile, 400);
  }
});
st.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sBirth') { profile.birth = t.value || ''; saveProfile(); renderHeader(); renderTabs(); }
  else if (t.classList.contains('bE')) {
    const k = t.dataset.k;
    const v = firstGrapheme(t.value.trim()) || CATALOG[k].e;
    t.value = v;
    if (!profile.buttons[k]) profile.buttons[k] = {};
    profile.buttons[k].e = v;
    saveProfile(); renderGrid();
  }
});
st.addEventListener('click', e => {
  const sx = e.target.closest('#sSex [data-v]');
  if (sx) {
    profile.sex = sx.dataset.v; saveProfile();
    st.querySelectorAll('#sSex [data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === profile.sex)));
    return;
  }
  const th = e.target.closest('#sTheme [data-v]');
  if (th) {
    prefs.theme = th.dataset.v; savePrefs(); applyTheme();
    st.querySelectorAll('#sTheme [data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === prefs.theme)));
    return;
  }
  if (e.target.closest('#sResetBtns')) { profile.buttons = {}; saveProfile(); render(true); return; }
  if (e.target.closest('#sPhoto')) { openAvatar(); return; }
  if (e.target.closest('#sClear')) openClear();
});

function tick() {
  const k = todayKey();
  if (k !== currentToday) {
    if (viewDay === currentToday) viewDay = k;
    currentToday = k;
    ensureSubs();
  }
  if (prefs.theme === 'auto') applyTheme();
  renderHeader();
  if (tab === 'jour') renderJour();
}

/* ---------- Démarrage ---------- */
migrate();
applyTheme();
render(true);
renderAvatar();
setInterval(tick, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); askedFeeds.clear(); setTimeout(checkLongFeeds, 300); } });
const dbReady = initDb();
Promise.race([dbReady, new Promise(r => setTimeout(r, 1500))]).then(() => {
  if (!profile.birth && !prefs.onboarded && sheet.hidden) openOnboarding();
  checkLongFeeds();
});
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
